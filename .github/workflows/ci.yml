name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SEED_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The build only needs these to be well-formed (env.ts validates shape,
      # not connectivity) — the two static routes that read them don't make a
      # live Supabase call at build time. Not secrets; safe as plain values.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Apply migrations to the Postgres service container
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed the database
        run: npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    env:
      # The Supabase CLI's fixed local demo keys (issuer "supabase-demo") —
      # identical on every machine that runs `supabase start` against this
      # repo's config.toml, since it doesn't override the JWT secret. Not
      # secrets; safe as plain values.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SEED_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned, not "latest" -- "latest" makes the action call GitHub's API
      # to resolve what that is on every run, unauthenticated (no token
      # passed here), which is exactly what just hit a rate limit and
      # failed the job outright. Pinning also means an unrelated new
      # Supabase CLI release can't break this job on its own; bump this
      # deliberately instead.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Starts the full local stack (Postgres, GoTrue, PostgREST, Kong) and
      # applies every migration from empty — the same environment Playwright
      # runs against locally, so auth and RLS behave identically to dev.
      - name: Start local Supabase
        run: supabase start

      - name: Seed the database
        run: npm run db:seed

      # Goes around `npm run auth:seed`'s --env-file=.env.local (there is no
      # such file in CI); the job env above already provides the same vars.
      - name: Seed the shared admin auth user
        run: npx tsx scripts/seed-auth-user.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
